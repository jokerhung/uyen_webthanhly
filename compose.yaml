services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webkygui
      POSTGRES_PASSWORD: dev_only_change_me
      POSTGRES_DB: webkygui_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webkygui -d webkygui_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
