# Coolify Docker Compose resource. Read docs/coolify-deploy.md before enabling.
# Do not attach this stack to an existing database/bucket without a verified backup
# and an explicitly planned data migration. No service publishes a host port.
services:
  app:
    build:
      context: .
      dockerfile: docker/coolify-app.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL using the db service hostname and URL-encoded password}
      SITE_URL: ${SITE_URL:?Set the public HTTPS website URL}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:?Set trusted public HTTPS admin origin(s)}
      PUBLIC_INDEXING_ENABLED: ${PUBLIC_INDEXING_ENABLED:-false}
      PRIVACY_POLICY_REVIEWED: ${PRIVACY_POLICY_REVIEWED:-false}
      MIN_CONSIGNMENT_ITEMS: ${MIN_CONSIGNMENT_ITEMS:-1}
      MAX_CONSIGNMENT_ITEMS: ${MAX_CONSIGNMENT_ITEMS:-10}
      MAX_IMAGES_PER_ITEM: ${MAX_IMAGES_PER_ITEM:-5}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-5242880}
      CONSIGNMENT_STORAGE_DIR: /data/consignments
      PRODUCT_IMAGE_STORAGE_DRIVER: minio
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: besties-media
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the scoped object-only app access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the scoped object-only app secret key}
    expose:
      - "3000"
    volumes:
      # Required even with MinIO: logo/favicon and any historical private local files.
      - app_private_data:/data/consignments
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      app-init:
        condition: service_completed_successfully

  # One-shot jobs: a failed initialization prevents the web process from starting.
  app-init:
    build:
      context: .
      dockerfile: docker/coolify-app.Dockerfile
    restart: "no"
    command: ["sh", "-ec", "node node_modules/prisma/build/index.js migrate deploy && node scripts/coolify-init-admin.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL using the db service hostname and URL-encoded password}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  minio-init:
    platform: linux/amd64
    build:
      context: ./docker/minio
      dockerfile: Dockerfile.mc
      target: bootstrap
    restart: "no"
    environment:
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a dedicated MinIO root username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong MinIO root password}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the scoped object-only app access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the scoped object-only app secret key}
    tmpfs:
      - /tmp:rw,mode=1777
    depends_on:
      minio:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set the database username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
      POSTGRES_DB: ${POSTGRES_DB:?Set the database name}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    # Build on the Coolify server from pinned source/base images, not a local image.
    # This Dockerfile and its healthcheck currently support linux/amd64 only.
    platform: linux/amd64
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a dedicated MinIO root username}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong MinIO root password}
      MINIO_REGION_NAME: us-east-1
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/minio-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
  app_private_data:
